<div class="home-container">
  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-bg">
      <span class="petal petal-1">🌸</span>
      <span class="petal petal-2">🌸</span>
      <span class="petal petal-3">🌸</span>
      <span class="petal petal-4">🌸</span>
      <span class="petal petal-5">🌸</span>
    </div>
    <div class="hero-content">
      <p class="hero-jp">こんにちは</p>
      <h1 class="hero-title">Japanese Learning</h1>
      <p class="hero-subtitle">Chọn phương pháp học phù hợp với bạn</p>
      <div class="hero-divider"></div>
    </div>
  </section>

  <!-- Menu Grid -->
  <section class="menu-grid">
    <a
      *ngFor="let item of menuItems"
      (click)="navigateTo(item.path)"
      [class.active]="isActive(item.path)"
      class="menu-card"
      [style.--card-gradient]="item.gradient"
    >
      <div class="card-icon">{{ item.icon }}</div>
      <h2 class="card-title">{{ item.title }}</h2>
      <p class="card-desc">{{ item.description }}</p>
      <div class="card-arrow">→</div>
    </a>
  </section>

  <!-- Footer -->
  <footer class="home-footer">
    <p>がんばって！ — Hãy cố gắng nhé!</p>
  </footer>
</div>
