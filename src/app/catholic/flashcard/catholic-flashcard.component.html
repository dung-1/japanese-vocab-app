<section *ngIf="current; else empty" class="flashcard-wrap"><div class="progress">Câu {{ currentIndex + 1 }} / {{ questions.length }}</div><button class="card" (click)="flipped = !flipped"><span class="hint">{{ flipped ? 'Đáp án' : 'Câu hỏi · chạm để xem đáp án' }}</span><strong>{{ flipped ? current.answer : current.question }}</strong><small *ngIf="flipped && current.reference">Tham chiếu: {{ current.reference }}</small></button><div class="controls"><button (click)="previous()">← Trước</button><button (click)="next()">Tiếp →</button></div></section><ng-template #empty><p class="empty">Hãy chọn bài học để bắt đầu.</p></ng-template>
