<div class="ai-page">
  <!-- Backdrop for Mobile Sidebar - Hidden on Desktop via CSS -->
  <div class="sidebar-backdrop" *ngIf="sidebarOpen()" (click)="toggleSidebar()"></div>

  <!-- Sidebar: No longer using *ngIf to preserve Flexbox layout on Desktop -->
  <app-chat-history-sidebar [class.sidebar-open]="sidebarOpen()" [class.sidebar-collapsed]="!sidebarOpen()"
    [sessions]="sessions()" [currentSessionId]="currentSessionId()" [loading]="sessionsLoading()"
    (sessionSelected)="onSessionSelected($event)" (newChat)="onNewChat()" (deleteSession)="onDeleteSession($event)"
    (renameSession)="onRenameSession($event)" (settingsClicked)="goToSettings()"></app-chat-history-sidebar>

  <!-- Main Chat Area -->
  <div class="chat-area">
    <!-- Mobile Header -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="menu-toggle" (click)="toggleSidebar()" title="Menu">
          {{ sidebarOpen() ? '◀' : '▶' }}
        </button>
        <button class="back-btn" (click)="goHome()">← Trang chủ</button>
      </div>

      <div class="top-bar-center">
        <span class="model-name">Trợ lý AI</span>
      </div>

      <div class="top-bar-right"></div>
    </header>

    <div class="chat-window" #chatWindow>
      <!-- Welcome screen -->
      <div *ngIf="ai.messages().length === 0" class="empty-state">
        <div class="empty-icon">🤖</div>
        <h1 class="welcome-title">Chào bạn!</h1>
        <p class="welcome-text">Tôi có thể giúp bạn học Kanji, Từ vựng, Bộ thủ hoặc Ngữ pháp N2-N4.</p>
        <div class="suggestion-chips">
          <div class="chip" (click)="onSubmit()">/kanji 食</div>
          <div class="chip" (click)="onSubmit()">/bunpo ～たら</div>
          <div class="chip" (click)="onSubmit()">/quiz N3</div>
        </div>
      </div>

      <!-- Messages -->
      <app-ai-chat-bubble *ngFor="let m of ai.messages(); trackBy: trackById" [message]="m"
        (completed)="onMessagesUpdate()"></app-ai-chat-bubble>

      <div *ngIf="ai.busy() && lastIsStreaming()" class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>

    <!-- Floating Input Section -->
    <footer class="input-section">
      <form class="input-form" (ngSubmit)="onSubmit()">
        <div class="input-container">
          <!-- Active command tag -->
          <div class="active-command-tag" *ngIf="activeCommand">
            <span class="tag-icon" [style.background-color]="activeCommand.color">{{ activeCommand.icon }}</span>
            <span class="tag-label">{{ activeCommand.label }}</span>
            <button class="tag-remove" type="button" (click)="removeActiveCommand()">×</button>
          </div>

          <div class="input-row">
            <div class="input-wrapper">
              <app-slash-command-menu *ngIf="showSlashMenu" [commands]="slashMenuCommands"
                [activeIndex]="slashMenuIndex" (selected)="selectCommand($event)" (dismissed)="onMenuDismissed()">
              </app-slash-command-menu>

              <textarea #questionInput [(ngModel)]="question" (ngModelChange)="onInputChange($event)"
                (keydown)="onKeydown($event)" (input)="autoResize($event)" name="question"
                placeholder="Nhập câu hỏi hoặc dùng /..." [disabled]="ai.busy() || loading()" autocomplete="off"
                rows="1">
              </textarea>
            </div>

            <button type="submit" class="send-btn" [disabled]="!question.trim() || ai.busy() || loading()">
              {{ ai.busy() ? '...' : '↑' }}
            </button>
            <button type="button" *ngIf="ai.busy()" class="abort-btn" (click)="ai.abort()">
              ✕
            </button>
          </div>
        </div>
      </form>
    </footer>
  </div>
</div>
