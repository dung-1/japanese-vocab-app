<div class="sidebar-container">
  <div class="sidebar-header">
    <button class="new-chat-btn" (click)="newChat.emit()">
      <span class="icon">+</span> Chat mới
    </button>
  </div>

  <div class="sessions-list">
    <div *ngIf="loading" class="loading-state">
      <div class="spinner"></div>
      <span>Đang tải lịch sử...</span>
    </div>

    <div *ngIf="!loading && sessions.length === 0" class="empty-state">
      Chưa có lịch sử chat
    </div>

    <div *ngFor="let group of groupedSessions" class="session-group">
      <div class="group-title">{{ group.group }}</div>

      <div
        *ngFor="let s of group.items"
        class="session-item"
        [class.active]="s.id === currentSessionId"
        [class.menu-open]="openMenuId === s.id"
        (click)="sessionSelected.emit(s.id)"
        (dblclick)="onRename(s)"
      >
        <!-- Tiêu đề session — flex:1 + overflow:hidden để ellipsis đúng -->
        <div class="item-main">
          <span class="title">{{ s.title }}</span>
        </div>

        <!-- Nút 3 chấm: ẩn mặc định, hiện khi hover hoặc menu-open -->
        <button
          class="item-menu-btn"
          type="button"
          (click)="toggleMenu(s.id, $event)"
          aria-label="Tùy chọn"
        >
          ···
        </button>

        <!-- Dropdown menu: absolute, chỉ render khi mở -->
        <div
          class="session-menu"
          *ngIf="openMenuId === s.id"
          (click)="$event.stopPropagation()"
        >
          <button class="menu-item" type="button" (click)="onRename(s); closeMenu()">
            <span class="menu-icon">✏️</span>
            <span>Đổi tên</span>
          </button>

          <button class="menu-item" type="button" (click)="pinSession(s); closeMenu()">
            <span class="menu-icon">📌</span>
            <span>Ghim</span>
          </button>

          <button class="menu-item" type="button" (click)="archiveSession(s); closeMenu()">
            <span class="menu-icon">📁</span>
            <span>Lưu trữ</span>
          </button>

          <div class="menu-divider"></div>

          <button class="menu-item danger" type="button" (click)="deleteSession.emit(s.id); closeMenu()">
            <span class="menu-icon">🗑️</span>
            <span>Xóa</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="sidebar-footer">
    <div class="user-profile" [class.menu-open]="openMenuId === 'user-profile'">
      <div class="avatar">JL</div>
      <span class="username">Japanese Learner</span>

      <button
        class="item-menu-btn user-profile-menu-btn"
        type="button"
        (click)="toggleMenu('user-profile', $event)"
        aria-label="Tùy chọn tài khoản"
      >
        ···
      </button>

      <div
        class="session-menu user-profile-menu"
        *ngIf="openMenuId === 'user-profile'"
        (click)="$event.stopPropagation()"
      >
        <button class="menu-item" type="button" (click)="settingsClicked.emit(); closeMenu()">
          <span class="menu-icon">⚙️</span>
          <span>Cài đặt</span>
        </button>

        <button class="menu-item" type="button" (click)="closeMenu()">
          <span class="menu-icon">👤</span>
          <span>Hồ sơ</span>
        </button>
      </div>
    </div>
  </div>
</div>
